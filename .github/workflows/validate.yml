name: Validate Skill and Web V1

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository and skill
        run: python3 scripts/validate_skill.py
      - name: Install backend
        run: python3 -m pip install -e "./backend[dev]"
      - name: Test backend
        working-directory: backend
        run: python3 -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare/package-lock.json
      - name: Install uv
        run: python -m pip install uv==0.12.17
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Worker tools
        working-directory: cloudflare
        run: npm ci
      - name: Test Worker adapters
        working-directory: cloudflare
        run: uv run --python 3.14 python -m pytest
      - name: Verify Worker and Python dependency bundle without deploying
        working-directory: cloudflare
        run: npm run deploy:dry
      - name: Save Python Worker dependencies for Windows deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/web-pwa-v1'
        uses: actions/upload-artifact@v4
        with:
          name: python-worker-dependencies-${{ github.sha }}
          path: cloudflare/python_modules/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
